# =========================================================
# SWMM Backend
# =========================================================

build_backend:
  extends:
    - .offline_deploy_job
    - .default_dev_rules

  stage: build

  before_script:
    - |
      echo "$HARBOR_PASSWORD" | docker login "$HARBOR_URL" \
        --username "$HARBOR_USERNAME" \
        --password-stdin

  script:
    - |
      docker buildx build \
        --no-cache \
        --pull \
        --load \
        -t swmm-backend-dev:${CI_COMMIT_SHORT_SHA} \
        swmm


# =========================================================
# User-Auth
# =========================================================

build_userauth:
  extends:
    - .offline_deploy_job
    - .default_dev_rules

  stage: build

  before_script:
    - |
      echo "$HARBOR_PASSWORD" | docker login "$HARBOR_URL" \
