# =========================================================
# Gitleaks
# =========================================================

gitleaks:
  extends:
    - .dev_job
    - .default_mr_rules

  stage: gitleaks

  allow_failure: true

  variables:
    GIT_DEPTH: "50"

  script:
    - |
      echo "Running Gitleaks v8.30.1"
      echo "MR target branch: ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      echo "MR target SHA: ${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      echo "MR commit SHA: ${CI_COMMIT_SHA}"

      git fetch origin \
        "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" \
        --depth=50

      docker run --rm \
        --network none \
        -v "$CI_PROJECT_DIR:/path:ro" \
        172.16.50.13/platform/gitleaks@sha256:9682c55020e386b2079da87080536842ecae2755c52a830b622af63baa271de5 \
        git \
        /path \
        --log-opts="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}"


# =========================================================
# Trivy Filesystem - SWMM
# =========================================================

trivy_swmm_fs:
  extends:
    - .dev_job
    - .default_mr_rules
    - .trivy_fs_template

  stage: trivy_fs

  allow_failure: true

  script:
    - |
      trivy fs \
        --scanners vuln,misconfig,secret \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        --no-progress \
        swmm


