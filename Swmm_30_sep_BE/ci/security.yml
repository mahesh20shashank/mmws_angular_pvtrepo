# =========================================================
# Trivy Image - SWMM
# =========================================================

trivy_swmm_image:
  extends:
    - .offline_deploy_job
    - .default_dev_rules
    - .trivy_image_template

  stage: trivy_image

  allow_failure: true

  needs:
    - build_backend

  script:
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /home/gitlab-runner/trivy-db:/root/.cache/trivy \
        172.16.50.13/platform/trivy@sha256:8be6abf1f8e24bc3c8245397a2d34d927a512b3d8e429dde24de0adc8fcd8496 \
        image \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        --skip-db-update \
        swmm-backend-dev:${CI_COMMIT_SHORT_SHA}


