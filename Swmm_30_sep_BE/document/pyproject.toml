[[tool.poetry.source]]
name = "nexus"
url = "http://172.16.50.12:8081/repository/pypi-group-prod/simple"
priority = "primary"

[project]
name = "document"
version = "0.1.0"
description = "Shared document/file storage microservice used by SWMM and ITTTM."
authors = [
    { name = "Cloudstrats" }
]
readme = "Readme.md"
requires-python = ">=3.10,<4"

dependencies = [
    "django>=5.2,<6.0",
    "django-cors-headers>=4.9,<5.0",
    "django-environ>=0.13,<1.0",
    "django-filter>=25.2,<26.0",
    "djangorestframework>=3.17,<4.0",
    "drf-spectacular>=0.29,<1.0",
    "drf-spectacular-sidecar (>=2026.6.1,<2027.0.0)",
    "gunicorn>=26.0,<27.0",
    "openpyxl>=3.1.2",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "python-dotenv>=1.2,<2.0",
    "reportlab>=4.0.0",
    "ruff (>=0.16.2,<0.17.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-django = "^4.10.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
