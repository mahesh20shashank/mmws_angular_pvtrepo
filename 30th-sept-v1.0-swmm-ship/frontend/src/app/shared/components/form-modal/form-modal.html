<app-modal [title]="title" size="lg" (closeModal)="onCancel()">
  <div class="form-modal">
    <!-- Body -->
    @if (form) {
    <form [formGroup]="form" class="modal-body p-0">

      @for(field of fields; track field.key) {
      @if (shouldShowField(field)) {

      <div class="field mb-3">

        @switch(field.type) {

        @case('text') {
        <app-input-field [label]="field.label" [placeholder]="field.placeholder || ''"
          [required]="isRequiredField(field.key)" [formControlName]="field.key">
        </app-input-field>
        }

        @case('select') {
        <app-select-input [label]="field.label" [options]="field.options || []"
          [required]="isRequiredField(field.key)" [formControlName]="field.key">
        </app-select-input>
        }

        @case('date') {
        <app-input-field type="date" [label]="field.label" [required]="isRequiredField(field.key)"
          [formControlName]="field.key">
        </app-input-field>
        }

        }

        @if (form.get(field.key)?.invalid && form.get(field.key)?.touched) {
        <span class="error text-xs text-red-400 mt-1 block">{{ getError(field.key) }}</span>
        }

      </div>
      }
      }

    </form>
    } @else {
    <div class="modal-body p-4 text-center">
      <span>Loading…</span>
    </div>
    }

    <!-- Footer -->
    <div class="footer flex justify-end gap-3 pt-4 mt-4 border-t border-[var(--border-color,rgba(255,255,255,0.1))]">
      <app-button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </app-button>

      <app-button type="button" class="btn-save" (click)="onSave()">
        Save
      </app-button>
    </div>
  </div>
</app-modal>
