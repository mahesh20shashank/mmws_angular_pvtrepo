<app-master-card cardTitle="Search Results - Raise FUSS">

  <div class="flex items-center gap-3 mb-5">
    <app-button
      type="button"
      (click)="goBack()"
      class="h-10 px-4 rounded-xl bg-white/10 border border-white/10 text-white hover:bg-white/20 transition">
      Back
    </app-button>
  </div>

  <!-- Status Legend -->
  <div class="flex items-center gap-10 mb-5 flex-wrap">
    <div class="flex items-center gap-2">
      <app-icon name="flag" [size]="16" class="text-[#FF4D4F]" />
      <span class="text-sm text-white/90">Routines Due</span>
    </div>

    <div class="flex items-center gap-2">
      <app-icon name="flag" [size]="16" class="text-[#FFB020]" />
      <span class="text-sm text-white/90">
        Routines due in less than 500 running hours OR 3 months.
      </span>
    </div>

    <div class="flex items-center gap-2">
      <app-icon name="flag" [size]="16" class="text-[#667085]" />
      <span class="text-sm text-white/90">
        Routines due in 500 and 1000 running hours OR 3 to 6 months.
      </span>
    </div>
  </div>

  <!-- Search + Export -->
  <div class="flex justify-between items-center mt-4 mb-4 gap-3">
    <div class="relative flex-1">
      <div
        class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40 pointer-events-none z-10"
      >
        <app-icon name="search" [size]="16" [strokeWidth]="2" color="currentColor" />
      </div>

      <input
        type="text"
        placeholder="Search"
        aria-label="Search"
        (input)="onSearch($event)"
        class="w-full h-10 rounded-[10px] bg-white/[0.04] border border-white/10 pl-10 pr-3 content text-white placeholder:text-white/40 outline-none focus:border-white/20"
      />
    </div>

    <app-button
      type="button"
      (click)="clearFilters()"
      class="h-11 px-4 rounded-[10px] bg-white/10 border border-white/10 text-white whitespace-nowrap shrink-0"
    >
      Clear Filters
    </app-button>

    <app-export-toolbar
      [busy]="exportBusy()"
      [disabled]="filteredRows().length === 0"
      (exportRequested)="onExport($event)"
    />
  </div>

  <!-- Grid -->
  <div class="fuss-grid-wrapper w-full mt-4">
    <app-data-grid
      [columnDefs]="columnDefs"
      [rowData]="filteredRows()"
      [totalRowCount]="totalRowCount()"
      [pageSize]="10"
      [resetKey]="filterVersion()"
      [height]="'440px'"
      [loading]="isLoading()"
      (pageRequested)="onPageRequested($event)">
    </app-data-grid>
  </div>

</app-master-card>
