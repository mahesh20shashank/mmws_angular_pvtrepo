<app-help-guidance [bodyHtml]="helpHtml" />

<app-master-card
  cardTitle="Search Result - Planned Routines to be Undertaken">

  <form [formGroup]="searchForm">

    <div class="grid grid-cols-5 gap-4 mt-4">

      <app-select-input
        label="Equipment Sub-Department"
        formControlName="subDept"
        [options]="subDepartmentOptions()">
      </app-select-input>

      <app-select-input
        label="Equipment Name"
        formControlName="equipment"
        [options]="equipmentOptions()">
      </app-select-input>

      <app-select-input
        label="Routine Type"
        formControlName="routineType"
        [options]="routineTypeOptions()">
      </app-select-input>

      <div class="col-span-2 flex items-end justify-end gap-3">
        <app-button
          type="button"
          (click)="clearFilters()"
          class="h-10 p-2 rounded-xl bg-white/10 border border-white/10 hover:bg-white/20 transition whitespace-nowrap">

          Clear Filter

        </app-button>

        <app-button
          type="button"
          (click)="syncWithCmms()"
          [disabled]="syncingCmms()"
          class="p-2 h-10 rounded-xl bg-yellow-400 border border-white/10 text-white whitespace-nowrap disabled:cursor-not-allowed disabled:opacity-60">

          {{ syncingCmms() ? 'Syncing…' : 'Sync With CMMS' }}

        </app-button>
      </div>

    </div>

  </form>

  <!-- Status Legend -->

  <div class="flex items-center gap-10 mt-5 mb-5">

    <div class="flex items-center gap-2">

      <app-icon name="flag" [size]="16" class="text-[#FF4D4F]" />

      <span class="text-sm text-white/90">
        Routines Due
      </span>

    </div>

    <div class="flex items-center gap-2">

      <app-icon name="flag" [size]="16" class="text-[#FFB020]" />

      <span class="text-sm text-white/90">
        Routines Due in less than 500 R/H OR 3 months.
      </span>

    </div>

    <div class="flex items-center gap-2">

      <app-icon name="flag" [size]="16" class="text-[#667085]" />

      <span class="text-sm text-white/90">
        Routines Due in 500 to 1000 R/H OR 3 to 6 months.
      </span>

    </div>

  </div>

  <!-- Search + Export -->

  <div class="flex justify-between items-center gap-4 mb-5" [formGroup]="searchForm">

    <div class="relative flex-1">

      <div
        class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40 pointer-events-none">

        <app-icon name="search" [size]="16" />

      </div>

      <input
        type="text"
        id="planned-routines-search"
        formControlName="search"
        placeholder="Search"
        aria-label="Search planned routines"
        class="w-full h-10 rounded-xl bg-white/[0.04] border border-white/10 pl-10 pr-3 text-white placeholder:text-white/40 outline-none focus:border-white/20"/>

    </div>

    <app-export-toolbar
      [busy]="exportBusy()"
      [disabled]="filteredRoutines().length === 0"
      (exportRequested)="onExport($event)"
    />

  </div>
   <div class="fuss-grid-wrapper w-full">

    <app-data-grid
      [columnDefs]="columnDefs"
      [rowData]="filteredRoutines()"
      [totalRowCount]="totalRowCount()"
      [pageSize]="10"
      [height]="'440px'"
      [loading]="isLoading()"
      (rowClicked)="onRowClicked($event)"
      (pageRequested)="onPageRequested($event)">
    </app-data-grid>

  </div>

</app-master-card>
