<app-master-card cardTitle ="Search Result - Raise FUSS to be Undertaken">
<div class="pb-2">
    <div class="grid grid-cols-5 gap-4 mt-4">

        <select
            class="h-10 rounded-xl bg-white/10 border border-white/10 px-4 pr-10 text-white text-sm focus:outline-none">
            <option>Equipment Section</option>
        </select>

        <select
            class="h-10 rounded-xl bg-white/10 border border-white/10 px-4 pr-10 text-white text-sm focus:outline-none">
            <option>Equipment Name</option>
        </select>

        <select
            class="h-10 rounded-xl bg-white/10 border border-white/10 px-4 pr-10 text-white text-sm focus:outline-none">
            <option>Routine Type</option>
        </select>

        <div class="flex gap-2">
            <button class="px-4 rounded-xl bg-white/10 border border-white/10 text-white">
                Clear Filter
            </button>

        </div>

    </div>
</div>
<div class="flex items-center gap-10 mt-4 mb-5">

    <!-- Red -->
    <div class="flex items-center gap-2">

        <app-icon name="flag" [size]="16" class="text-[#FF4D4F]" />

        <span
            class="
                text-[13px]
                font-normal
                text-white/90
                font-['Inter']
            ">
            Routines Due
        </span>

    </div>

    <!-- Yellow -->
    <div class="flex items-center gap-2">

        <app-icon name="flag" [size]="16" class="text-[#FFB020]" />

        <span
            class="
                text-[13px]
                font-normal
                text-white/90
                font-['Inter']
            ">
            Routines Due in less than 500 R/H OR 3 months.
        </span>

    </div>

    <!-- Grey -->
    <div class="flex items-center gap-2">

        <app-icon name="flag" [size]="16" class="text-[#667085]" />

        <span
            class="
                text-[13px]
                font-normal
                text-white/90
                font-['Inter']
            ">
            Routines Due in 500 to 1000 R/H OR 3 to 6 months.
        </span>

    </div>

</div>
<div class="flex justify-evenly items-center mt-4 mb-4">

    <div class="relative w-[83%] shrink-0">

        <!-- Search Icon -->
        <div class="
            absolute
            left-3
            top-1/2
            -translate-y-1/2
            text-white/40
            pointer-events-none
            z-10
            ">
            <app-icon name="search" [size]="16" [strokeWidth]="2" color="currentColor" />
        </div>

        <!-- Input -->
        <input type="text" placeholder="Search" (input)="onSearch($event)" class="
            w-full
            h-10
            rounded-[10px]
            bg-white/[0.04]
            border
            border-white/10
            pl-10
            pr-3
            content
            text-white
            placeholder:text-white/40
            outline-none
            focus:border-white/20
            " />

    </div>

    <div class="flex gap-2 pl-2">

        <app-export-toolbar
      [busy]="exportBusy()"
      [disabled]="maintopRoutines.length === 0"
      (exportRequested)="onExport($event)"
    />

    </div>

</div>



<!-- Table -->
<app-data-grid
  [rowData]="maintopRoutines"
  [columnDefs]="columnDefs"
  [pagination]="true"
  [pageSize]="10"
  height="440px">
</app-data-grid>
</app-master-card>
