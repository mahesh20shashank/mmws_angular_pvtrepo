<div class="actions">
  <app-button type="button" class="action-btn action-btn--primary" (click)="onCloseRoutine($event)">
    <app-icon name="check-circle-2" [size]="14" variant="inherit" />
    Close Routine
  </app-button>

  <app-button type="button" class="action-btn action-btn--danger" (click)="onDelete($event)" title="Delete">
    <app-icon name="trash" [size]="14" variant="inherit" />
  </app-button>
</div>
