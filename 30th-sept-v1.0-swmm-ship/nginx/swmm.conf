upstream frontend {
    server swmm-frontend-dev:80;
    keepalive 32;
}

upstream backend {
    server swmm-backend-dev:8000;
    keepalive 32;
}

upstream userauth {
    server swmm-userauth-dev:8001;
    keepalive 32;
}

upstream document {
    server swmm-document-dev:8002;
    keepalive 32;
}

server {

    listen 80 default_server;

    server_name _;

    # =========================================================
    # Authentication Service
    # =========================================================
    location /api/v1/auth/ {

        proxy_pass http://userauth;

        include /etc/nginx/proxy_params;
    }

    location /api/v1/authz/ {

        proxy_pass http://userauth;

        include /etc/nginx/proxy_params;
    }

    location /api/v1/delegation/ {

        proxy_pass http://userauth;

        include /etc/nginx/proxy_params;
    }


    # =========================================================
    # Document Service
    # =========================================================


    # =========================================================
    # Main Backend APIs
    # =========================================================
    location /api/ {

        proxy_pass http://backend;

        include /etc/nginx/proxy_params;
    }


    # =========================================================
    # Swagger
    # =========================================================
    location /swagger/ {

        proxy_pass http://backend;

        include /etc/nginx/proxy_params;
    }


    # =========================================================
    # OpenAPI Schema
    # =========================================================
    location /schema/ {

        proxy_pass http://backend;

        include /etc/nginx/proxy_params;
    }


    # =========================================================
    # Django Admin
    # =========================================================
    location /admin/ {

        proxy_pass http://backend;

        include /etc/nginx/proxy_params;
    }


    # =========================================================
    # Static Files
    # =========================================================
    location /static/ {

        alias /usr/share/nginx/html/static/;
    }


    # =========================================================
    # Media Files
    # =========================================================
    location /media/ {

        alias /usr/share/nginx/html/media/;
    }


    # =========================================================
    # Angular Frontend
    # =========================================================
    location / {

        proxy_pass http://frontend;

        include /etc/nginx/proxy_params;
    }


    # =========================================================
    # Compression
    # =========================================================
    gzip on;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

}
